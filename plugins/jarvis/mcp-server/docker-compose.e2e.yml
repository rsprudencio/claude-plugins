services:
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "25432:5432"
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis"]
      interval: 2s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
