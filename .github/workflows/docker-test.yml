name: Docker Test

on:
  pull_request:
    paths:
      - 'docker/**'
      - 'host-inference/**'
      - 'plugins/*/mcp-server/**'
      - 'apps/memory-explorer/**'
      - 'lib/jarvis-common/**'
      - 'Makefile'
      - '.github/workflows/docker-*.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run unit and host-inference tests
        run: make test

      - name: Build Docker image with unconstrained dependency resolution
        run: docker build -f docker/Dockerfile -t jarvis-test .

      - name: Verify resolved image dependency and import contracts
        run: |
          docker run --rm \
            --entrypoint python3 \
            -v "$PWD/docker/tests/verify_runtime_contract.py:/tmp/verify_runtime_contract.py:ro" \
            jarvis-test \
            /tmp/verify_runtime_contract.py

      - name: Start host-model contract stubs
        run: |
          python3 docker/tests/model_host_stub.py > /tmp/jarvis-model-stub.log 2>&1 &
          echo $! > /tmp/jarvis-model-stub.pid
          for port in 8751 8752; do
            for i in $(seq 1 10); do
              curl -sf "http://127.0.0.1:${port}/health" && break
              sleep 1
            done
            curl -sf "http://127.0.0.1:${port}/health"
          done

      - name: Create test fixtures
        run: |
          mkdir -p /tmp/test-vault /tmp/test-config
          echo '{"vault_path":"/vault","vault_confirmed":true}' > /tmp/test-config/config.json

      - name: Start complete Jarvis container
        run: |
          docker run -d --name jarvis-test \
            --add-host host.docker.internal:host-gateway \
            -p 8741:8741 \
            -p 8742:8742 \
            -p 8744:8744 \
            -p 127.0.0.1:8750:8750 \
            -v /tmp/test-vault:/vault \
            -v /tmp/test-config:/config \
            -e JARVIS_HOME=/config \
            -e JARVIS_VAULT_PATH=/vault \
            -e TODOIST_API_TOKEN=docker-smoke-no-network \
            jarvis-test

      - name: Run black-box service and retrieval smoke
        run: python3 docker/tests/smoke_client.py

      - name: Verify container remains stable
        run: |
          test "$(docker inspect -f '{{.State.Running}}' jarvis-test)" = "true"
          test "$(docker inspect -f '{{.RestartCount}}' jarvis-test)" = "0"

      - name: Diagnostics
        if: failure()
        run: |
          docker logs jarvis-test 2>&1 || true
          cat /tmp/jarvis-model-stub.log 2>/dev/null || true
          docker inspect jarvis-test 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f jarvis-test 2>/dev/null || true
          if [ -f /tmp/jarvis-model-stub.pid ]; then
            kill "$(cat /tmp/jarvis-model-stub.pid)" 2>/dev/null || true
          fi
